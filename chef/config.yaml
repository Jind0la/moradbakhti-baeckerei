# Moradbakhti-KI Bäckerei Chef-Agent — Configuration
# Nur Chef-Tools, kein Kunden-Zugriff.

model:
  default: deepseek-v4-flash
  provider: deepseek

agent:
  max_turns: 30

terminal:
  backend: local
  timeout: 180

memory:
  provider: ""

# SESSION-MANAGEMENT
session_reset:
  mode: idle
  idle_minutes: 60
group_sessions_per_user: false

# PLUGIN-KONFIGURATION
plugins:
  enabled:
    - moradbakhti-kmu
  disabled: []

known_plugin_toolsets:
  cli:
    - moradbakhti_kmu_chef
  telegram:
    - moradbakhti_kmu_chef

# SICHERHEIT: NUR Chef-Toolsets — KEINE Kunden-Tools!
platform_toolsets:
  cli:
    - clarify
    - messaging
    - tts
    - moradbakhti_kmu_chef
  telegram:
    - clarify
    - messaging
    - tts
    - moradbakhti_kmu_chef

approvals:
  mode: off
  timeout: 60
  cron_mode: deny
  destructive_slash_confirm: false

security:
  allow_lazy_installs: false

# Gateway-Plattformen
telegram:
  reactions: false
  allowed_chats: ""
