# Moradbakhti-KI Bäckerei Agent — Configuration
# Moradbakhti-KI Bäckerei Agent — Configuration
# Minimal config with only safe toolsets and the KMU plugin.

model:
  default: deepseek-v4-flash
  provider: deepseek

agent:
  max_turns: 30
  personality: ""

terminal:
  backend: local
  timeout: 180

memory:
  provider: ""

# SESSION-MANAGEMENT: Auto-Reset nach 60 Min Inaktivität (Datenschutz)
session_reset:
  mode: idle
  idle_minutes: 60
group_sessions_per_user: false

# PLUGIN-KONFIGURATION
plugins:
  enabled:
    - moradbakhti-kmu
  disabled: []

# BEKANNTE PLUGIN-TOOLSETS (von Hermes auto-gefüllt, hier manuell vorgesetzt)
known_plugin_toolsets:
  cli:
    - moradbakhti_kmu_kunden
  telegram:
    - moradbakhti_kmu_kunden

# SICHERHEIT: NUR diese Toolsets (KEIN terminal, delegation, browser, etc.)
platform_toolsets:
  cli:
    - clarify
    - messaging
    - tts
    - moradbakhti_kmu_kunden
  telegram:
    - clarify
    - messaging
    - tts
    - moradbakhti_kmu_kunden

# Approvals: smart = LLM-gestützt für low-risk, prompt für high-risk
approvals:
  mode: off
  timeout: 60
  cron_mode: deny
  destructive_slash_confirm: false

security:
  allow_lazy_installs: false

# Gateway-Plattformen
telegram:
  reactions: false
  allowed_chats: ""
